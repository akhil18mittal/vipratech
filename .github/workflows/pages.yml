name: Build and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # CONTENT_PREVIEW=all builds every use case with noindex, for local review only.
      - name: Refuse preview builds
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${CONTENT_PREVIEW:-}" ]; then
            echo "::error::CONTENT_PREVIEW is set; preview builds must not be deployed"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # The diagram renderer drives the runner's preinstalled Chrome, so Puppeteer needn't download its own.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Type-check
        run: bun run typecheck

      - name: Check for unused code and dependencies
        run: bun run knip

      - name: Test
        run: bun run test

      # Rendered diagrams are reused while their source, the renderer and its config are unchanged (see the manifest
      # in public/diagrams/); a partial hit still reuses every SVG whose hash matches.
      - name: Cache rendered diagrams
        uses: actions/cache@v6
        with:
          path: public/diagrams
          key: diagrams-${{ runner.os }}-${{ hashFiles('src/content/use-cases/**', 'scripts/render-diagrams.ts', 'src/data/release.ts', 'bun.lock') }}
          restore-keys: |
            diagrams-${{ runner.os }}-

      - name: Build
        run: bun run build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Check the built site
        run: bun run check:dist
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Check the built site at phone width
        run: bun run check:mobile
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
